<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIGO Transporte</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  body { background: #FFB800; min-height: 100vh; display: flex; justify-content: center; }
  .pantalla {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    background: #FFB800;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 28px 28px;
  }

  /* ===== ESPACIO PARA EL LOGO ===== */
  .logo {
    width: 260px;
    height: 210px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 10px;
  }
  .logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  /* Aquí va tu logo: cambia logo.png por tu archivo */

  /* ===== IMAGEN CENTRAL ===== */
  .imagen-central {
    width: 100%;
    height: 360px;
    margin: 20px 0 40px;
    border-radius: 20px;
    overflow: hidden;
    position: relative;
  }
  .imagen-central img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.85;
  }
  .imagen-central::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, #FFB800 0%, transparent 25%, transparent 75%, #FFB800 100%);
  }

  /* ===== TEXTOS Y BOTÓN ===== */
  .texto-conductor {
    width: 100%;
    font-size: 22px;
    font-weight: 500;
    color: #0A1628;
    line-height: 1.3;
    margin-bottom: 28px;
  }
  .btn-ubicacion {
    width: 100%;
    background: #0A1628;
    color: #fff;
    border: none;
    border-radius: 16px;
    padding: 18px;
    font-size: 22px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
  }
  .terminos {
    margin-top: 28px;
    font-size: 13px;
    color: #0A1628;
    text-align: center;
  }
</style>
</head>
<body>

<div class="pantalla">

  <!-- AQUÍ VA TU LOGO -->
  <div class="logo">
    <img src="logo.png" alt="KIGO Transporte">
  </div>

  <!-- IMAGEN CENTRAL: hombre viendo celular / motos y carros -->
  <div class="imagen-central">
    <img src="hombre-celular.jpg" alt="Hombre esperando su viaje">
  </div>

  <p class="texto-conductor">Para encontrar tu conductor más cercano y calcular tu viaje</p>

  <button class="btn-ubicacion">📍 Permitir ubicación</button>

  <p class="terminos">Al continuar, aceptas nuestros términos</p>

</div>

</body>
</html>
