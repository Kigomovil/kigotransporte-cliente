<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIGO Transporte</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  body { background: #fff; min-height: 100vh; display: flex; justify-content: center; }
  .pantalla {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 24px 20px;
  }

  /* ===== ESPACIO PARA EL LOGO ===== */
  .logo {
    width: 250px;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo img { width: 100%; height: 100%; object-fit: contain; }

  /* ===== IMAGEN CENTRAL ===== */
  .imagen-central {
    width: 100%;
    height: 300px;
    margin: 12px 0 24px;
    border-radius: 20px;
    overflow: hidden;
    position: relative;
  }
  .imagen-central img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.85;
  }
  .imagen-central::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, #fff 0%, transparent 25%, transparent 75%, #fff 100%);
  }

  /* ===== TEXTO CONDUCTOR - MÁS PEQUEÑO ===== */
  .texto-conductor {
    width: 100%;
    font-size: 17px;
    font-weight: 500;
    color: #0A1628;
    line-height: 1.35;
    margin-bottom: 20px;
  }

  /* ===== BOTÓN QUE SÍ SE VE COMO BOTÓN ===== */
  .btn-ubicacion {
    width: 100%;
    background: #0A1628;
    color: #fff;
    border: none;
    border-radius: 16px;
    padding: 18px;
    font-size: 20px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(10,22,40,.35);
  }
  .btn-ubicacion:active { transform: scale(.98); }
  .btn-ubicacion svg { flex-shrink: 0; }

  /* ===== TÉRMINOS - UN POQUITO MÁS ARRIBA ===== */
  .terminos {
    margin-top: 14px;
    font-size: 13px;
    color: #0A1628;
    text-align: center;
  }

  /* ===== ADAPTABLE A CELULAR ===== */
  @media (max-width: 360px) {
    .pantalla { padding: 24px 18px 16px; }
    .logo { width: 210px; height: 170px; }
    .imagen-central { height: 260px; }
    .texto-conductor { font-size: 16px; }
    .btn-ubicacion { font-size: 18px; padding: 16px; }
  }
</style>
</head>
<body>

<div class="pantalla">

  <!-- AQUÍ VA TU LOGO -->
  <div class="logo">
    <img src="Logo.png" alt="KIGO Transporte">
  </div>

  <!-- IMAGEN CENTRAL -->
  <div class="imagen-central">
    <img src="hombre-celular-es.png" alt="Hombre esperando su viaje">
  </div>

  <p class="texto-conductor">Para encontrar tu conductor más cercano y calcular tu viaje</p>

  <button class="btn-ubicacion">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z" fill="#fff"/></svg>
    Permitir ubicación
  </button>

  <p class="terminos">Al continuar, aceptas nuestros términos</p>

</div>

</body>
</html>
